# The Launchpad's moods, on its Session button, filled from Home Assistant's own
# UI: scenes and scripts picked from a list, and playlists that run one mood script
# with their playlist and effect. A pad pressed (on the device or the website) runs its own.
#
# Install: copy this file to config/blueprints/automation/flash-dance/ and reload
# automations, then Settings → Automations → Blueprints → Launchpad moods.
blueprint:
  name: Launchpad moods
  description: >-
    Puts moods on the Launchpad's Session button: scenes, scripts and playlists.
    Runs the one pressed. Scenes and scripts come first, from the top left, named after
    the entity; then the playlists, each where its `row` says or after the last pad.
  domain: automation
  source_url: https://github.com/davidgomesdev/flash-dance/blob/main/home-assistant/launchpad_moods.yaml
  input:
    targets:
      name: Scenes and scripts
      description: In pad order, from the top left.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: [scene, script]
    mood_script:
      name: Mood script
      description: >-
        Run for a playlist pad, with the variables `playlist` and `effect` (empty
        when the pad has none): a script made from the Launchpad mood script
        blueprint, or your own.
      default: ""
      selector:
        entity:
          filter:
            - domain: script
    playlists:
      name: Playlists
      description: >-
        One per pad. A row (1 is the top) puts the pad after what is on that row
        already; without one it goes after the pad before it. No colour is white.
      default: []
      selector:
        object:
          multiple: true
          label_field: name
          description_field: playlist
          fields:
            name:
              label: Name
              required: true
              selector:
                text: {}
            playlist:
              label: Spotify playlist (URI or link)
              required: true
              selector:
                text: {}
            effect:
              label: Launchpad effect
              selector:
                select:
                  # The effects library's names; a test there keeps this in step.
                  custom_value: true
                  options:
                    - rainbow diagonal
                    - plasma
                    - fire
                    - rain
                    - ripple rings
                    - radar sweep
                    - starfield
                    - colour wipe
                    - ripple on press
                    - comet trail
                    - velocity heat
                    - lasers
                    - gravity
                    - pressure map
                    - spectrum
                    - pitch meter
                    - beat rings
                    - sound fire
                    - panel
            row:
              label: Row
              selector:
                number:
                  min: 1
                  max: 8
                  mode: box
            rgb:
              label: Colour
              selector:
                color_rgb: {}

# Every trigger while the last run still goes would only repeat it.
mode: queued

triggers:
  # The list is retained by the broker, so it only needs sending when it changes:
  # this automation saved, or Home Assistant started.
  - trigger: homeassistant
    event: start
    id: list
  - trigger: event
    event_type: automation_reloaded
    id: list
  - trigger: state
    entity_id: event.launchpad_mood
    not_from: [unavailable, unknown]
    not_to: [unavailable, unknown]
    id: press

variables:
  targets: !input targets
  mood_script: !input mood_script
  playlists: !input playlists
  # Eight hues, cycling: the same rainbow the effect picker has, near enough.
  palette:
    - [255, 0, 0]
    - [255, 128, 0]
    - [255, 220, 0]
    - [0, 255, 0]
    - [0, 220, 255]
    - [0, 80, 255]
    - [160, 0, 255]
    - [255, 0, 160]

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: list
        sequence:
          - action: mqtt.publish
            data:
              topic: flash-dance/moods/set
              retain: true
              # `rows` counts the pads used on each row, which is where the next
              # pad on it goes; `y` is the row the last pad went on.
              payload: >-
                {% set ns = namespace(rows=[0] * 8, y=0, found=-1, list=[]) %}
                {% set items = namespace(all=[]) %}
                {% for entity in targets %}
                  {% set items.all = items.all + [{
                    'name': state_attr(entity, 'friendly_name') or entity, 'row': 0, 'rgb': none}] %}
                {% endfor %}
                {% for p in playlists %}
                  {% set items.all = items.all + [{
                    'name': p.name, 'row': p.row | default(0, true) | int, 'rgb': p.rgb | default([255, 255, 255], true)}] %}
                {% endfor %}
                {% for item in items.all %}
                  {% if item.row %}{% set ns.y = item.row - 1 %}{% endif %}
                  {% set ns.found = -1 %}
                  {% for y in range(ns.y, 8) %}
                    {% if ns.found < 0 and ns.rows[y] < 8 and (not item.row or y == ns.y) %}
                      {% set ns.found = y %}
                    {% endif %}
                  {% endfor %}
                  {% if ns.found >= 0 %}
                    {% set y = ns.found %}
                    {% set ns.list = ns.list + [{
                      'pad': [ns.rows[y], y],
                      'name': item.name,
                      'rgb': item.rgb or palette[ns.list | length % 8],
                    }] %}
                    {% set ns.rows = ns.rows[:y] + [ns.rows[y] + 1] + ns.rows[y + 1:] %}
                    {% set ns.y = y %}
                  {% endif %}
                {% endfor %}
                {{ ns.list | to_json }}
      - conditions:
          - condition: trigger
            id: press
        sequence:
          - variables:
              name: "{{ trigger.to_state.attributes.event_type }}"
              entity: >-
                {% set ns = namespace(found='') %}
                {% for e in targets %}
                  {% if not ns.found and (state_attr(e, 'friendly_name') or e) == name %}
                    {% set ns.found = e %}
                  {% endif %}
                {% endfor %}
                {{ ns.found }}
              # Empty fields may be missing or null; both read as ''.
              playlist: >-
                {% set p = playlists | selectattr('name', 'eq', name) | first %}
                {{ (p.playlist if p else '') or '' }}
              effect: >-
                {% set p = playlists | selectattr('name', 'eq', name) | first %}
                {{ (p.effect if p else '') or '' }}
          - choose:
              - conditions: "{{ entity != '' }}"
                sequence:
                  # turn_on runs a script and activates a scene alike.
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ entity }}"
              - conditions: "{{ playlist != '' and mood_script != '' }}"
                sequence:
                  - action: script.turn_on
                    target:
                      entity_id: "{{ mood_script }}"
                    data:
                      variables:
                        playlist: "{{ playlist }}"
                        effect: "{{ effect }}"
