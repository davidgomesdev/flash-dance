name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  commits:
    # semantic-release reads these to pick the next version, so a bad one is a lost release.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional commits
        run: |
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          bad=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if ! [[ $subject =~ $re ]]; then
              echo "::error::${sha:0:7} is not a conventional commit: $subject"
              bad=1
            fi
          done < <(git rev-list --no-merges "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}")
          exit $bad

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
