name: release

on:
  push:
    branches: [main]
  # On main: same as a push. On any other branch: a draft release of that branch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Dry run: works out the version and tag without tagging or publishing anything.
  version:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ github.ref != 'refs/heads/main' || steps.next.outputs.new_release_published }}
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next
        uses: cycjimmy/semantic-release-action@v5
        with:
          dry_run: true
          branches: ${{ github.ref_name }}
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # main: v<next>. Other branches: v<next>+<n>, n counting that version's drafts so far.
      # ponytail: no commit warrants a bump -> falls back to the latest tag's version.
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.next.outputs.new_release_version }}
        run: |
          version="${NEXT:-$(git describe --tags --abbrev=0 | sed 's/^v//')}"
          tag="v$version"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            n=$(gh release list --limit 1000 --json tagName --jq "[.[] | select(.tagName | startswith(\"$tag+\"))] | length")
            tag="$tag+$((n + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.published == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          # ponytail: native arm runner, no ALSA cross-compile. Private repos need
          # a paid plan for it; swap to ubuntu-latest + cross if that bites.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Same bump semantic-release will commit, so the binaries carry the release version.
      - name: Set version
        run: find . -name Cargo.toml -not -path './target/*' -exec perl -0pi -e 's/^version = ".*?"/version = "${{ needs.version.outputs.version }}"/m' {} +
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos
      - name: Build
        run: |
          cargo build --release -p effects -p paint -p palette -p whack -p simon -p snake -p life
          cargo leptos build --release
      - name: Package
        run: |
          name=flash-dance-${{ needs.version.outputs.tag }}-${{ matrix.target }}
          mkdir -p "$name/bin"
          for b in effects paint palette whack simon snake life flash-dance-web; do
            cp "target/release/$b" "$name/bin/"
          done
          cp -r target/site "$name/site"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: flash-dance-${{ matrix.target }}
          path: flash-dance-*.tar.gz
          if-no-files-found: error

  # Runs only if every build job succeeded, so a failed target means no release.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: flash-dance-*
          merge-multiple: true
      # main: semantic-release bumps the Cargo versions, tags and creates the release
      # with dist/*.tar.gz attached (see .releaserc.json).
      - if: github.ref == 'refs/heads/main'
        uses: cycjimmy/semantic-release-action@v5
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" dist/*.tar.gz --prerelease --target "$GITHUB_SHA" --title "$TAG ($GITHUB_REF_NAME)" --generate-notes
