name: release

on:
  push:
    branches: [main]
  # On main: same as a push. On any other branch: a draft release of that branch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.sr.outputs.new_release_published || steps.draft.outputs.published }}
      tag: ${{ steps.sr.outputs.new_release_version && format('v{0}', steps.sr.outputs.new_release_version) || steps.draft.outputs.tag }}
      # Built commit: the tag for a real release (it holds the version bump), the branch head for a draft.
      ref: ${{ steps.sr.outputs.new_release_version && format('v{0}', steps.sr.outputs.new_release_version) || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Reads conventional commits since the last tag, bumps the Cargo versions,
      # tags and creates the GitHub release. Does nothing if no commit warrants one.
      - id: sr
        if: github.ref == 'refs/heads/main'
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ponytail: draft tag is branch+sha, no version bump; add if drafts need real versions.
      - id: draft
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="draft-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "$tag" --generate-notes
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.published == 'true'
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          # ponytail: native arm runner, no ALSA cross-compile. Private repos need
          # a paid plan for it; swap to ubuntu-latest + cross if that bites.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos
      - name: Build
        run: |
          cargo build --release -p effects -p paint -p palette -p whack -p simon -p snake -p life
          cargo leptos build --release
      - name: Package
        run: |
          name=flash-dance-${{ needs.version.outputs.tag }}-${{ matrix.target }}
          mkdir -p "$name/bin"
          for b in effects paint palette whack simon snake life flash-dance-web; do
            cp "target/release/$b" "$name/bin/"
          done
          cp -r target/site "$name/site"
          tar czf "$name.tar.gz" "$name"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" flash-dance-*.tar.gz
